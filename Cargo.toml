[package]
name = "gpui-scap"
description = "Modern, high-performance screen capture library for Rust. Cross-platform."
version = "0.0.9-gpui"
edition = "2021"
rust-version = "1.82"
license = "MIT"
authors = [
  "Siddharth <siddharth99c@gmail.com>",
  "Pranav <pranav2000joglekar@gmail.com>",
]
readme = "README.md"
repository = "https://github.com/helmerapp/scap"
documentation = "https://docs.rs/scap"
keywords = ["screen", "recording", "video", "capture", "media"]
categories = ["graphics", "multimedia", "multimedia::video"]

[features]
default = ["wayland", "x11"]
wayland = [
  "dep:pipewire",
  "dep:dbus",
  "dep:glow",
  "dep:khronos-egl",
  "dep:libc",
]
x11 = ["dep:xcb", "dep:x11"]

[dependencies]
anyhow = "1.0.86"
log = "0.4.16"
sysinfo = "0.39.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows-capture = "1.3.6"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
core-video = { version = "0.6.1", default-features = false, features = ["link"] }
tao-core-video-sys = "0.2.0"
core-graphics-helmer-fork = "0.24.0"
screencapturekit = "0.2.8"
screencapturekit-sys = "0.2.8"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSScreen", "NSGraphics"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSDictionary", "NSString", "NSValue"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
rand = "0.10"
xcb = { version = "1.4.0", features = [
  "randr",
  "xlib_xcb",
  "xfixes",
], optional = true }
x11 = { version = "2.21.0", optional = true }
pipewire = { version = "0.10.0", optional = true }
dbus = { version = "0.9.7", optional = true }
glow = { version = "0.18", optional = true }
khronos-egl = { version = "6", features = ["dynamic"], optional = true }
libc = { version = "0.2", optional = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSRunningApplication", "NSWindow", "NSResponder", "NSGraphics", "objc2-core-foundation"] }

[[test]]
name = "macos_targets"
harness = false

[target.'cfg(target_os = "macos")'.dev-dependencies.objc2-foundation]
version = "0.3.2"
default-features = false
features = ["std", "NSDate", "NSRunLoop"]
